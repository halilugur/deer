[package]
name = "deer"
version = "0.1.0"
edition = "2021"
authors = ["DEER Team"]
description = "Diagram Execution Engine in Rust — Modern Cross-Platform Flowchart Visual Programming Environment"

[dependencies]
eframe = "0.29.1"
egui = "0.29.1"
egui_plot = "0.29.0"
rfd = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.24", default-features = false, features = ["png"] }
egui_extras = { version = "0.29.1", features = ["svg"] }
